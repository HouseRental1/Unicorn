<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unicorn Home Appliances</title>
<meta name="description" content="Shop till for Unicorn Home Appliances">
<meta name="theme-color" content="#b3184d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unicorn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: showroom till. Deep-teal sidebar (bottom tab bar on phones) + working canvas.
   Brand: Unicorn reddish pink and white. Signature motifs: pink shelf price tags, a receipt-paper cart, the A–G energy label stripe. */
:root{
  --bg:#fbf4f6; --surface:#ffffff; --sunk:#fcf0f3; --line:#f1dbe2; --ink:#2b0d18; --muted:#7f5967;
  --side:#b3184d; --side-ink:#ffffff; --side-muted:#f8cdd9; --side-hi:#c92a5f;
  --accent:#d42a5c; --accent-soft:#fde4ec; --tag:#e0306a; --tag-ink:#ffffff; --paper:#ffffff; --paper-ink:#2b0d18;
  --good:#16804b; --good-soft:#d9f2e4; --warn:#9a5b00; --warn-soft:#fdeccc; --bad:#a8200d; --bad-soft:#fde2dc;
  --av1:#fde4ec; --av2:#fff0d9; --av3:#ece6fd; --av4:#ffe0e6;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgb(80 10 35 / .04),0 8px 24px -12px rgb(80 10 35 / .18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#190a10; --surface:#221018; --sunk:#2b1520; --line:#43202e; --ink:#fbeef2; --muted:#c99aab;
  --side:#560f2a; --side-ink:#ffffff; --side-muted:#e7a9bd; --side-hi:#781a3d;
  --accent:#ff6c96; --accent-soft:#4b1528; --tag:#ff4f86; --tag-ink:#ffffff; --paper:#2a1520; --paper-ink:#fbeef2;
  --good:#53c98c; --good-soft:#123323; --warn:#e8b14a; --warn-soft:#382a0e; --bad:#ff7a66; --bad-soft:#40160f;
  --av1:#4b1528; --av2:#3b2a12; --av3:#2b2250; --av4:#4a1820; --shadow:0 1px 0 rgb(0 0 0 / .2),0 10px 28px -14px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#190a10; --surface:#221018; --sunk:#2b1520; --line:#43202e; --ink:#fbeef2; --muted:#c99aab;
  --side:#560f2a; --side-ink:#ffffff; --side-muted:#e7a9bd; --side-hi:#781a3d;
  --accent:#ff6c96; --accent-soft:#4b1528; --tag:#ff4f86; --tag-ink:#ffffff; --paper:#2a1520; --paper-ink:#fbeef2;
  --good:#53c98c; --good-soft:#123323; --warn:#e8b14a; --warn-soft:#382a0e; --bad:#ff7a66; --bad-soft:#40160f;
  --av1:#4b1528; --av2:#3b2a12; --av3:#2b2250; --av4:#4a1820; --shadow:0 1px 0 rgb(0 0 0 / .2),0 10px 28px -14px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* Sidebar */
aside{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px 20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.mark{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 10px rgb(0 0 0 / .18))}
.mobilebar .brandrow{gap:10px;min-width:0}
.mobilebar .logo{width:40px;height:40px}
.lock .logo{width:120px;height:120px;margin:0 auto}
#printArea .plogo{display:block;width:30mm;height:30mm;margin:0 auto 2mm;object-fit:contain;filter:grayscale(1) contrast(1.2)}
.mark .eyebrow{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted)}
.mark h1{font:800 27px/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.label{display:flex;gap:2px;height:6px}
.label i{flex:1;border-radius:1px}
.e-A{background:#0e8a3e}.e-B{background:#4ea53a}.e-C{background:#a7c53a}.e-D{background:#d9b300}.e-E{background:#e78417}.e-F{background:#d9491e}.e-G{background:#c3161c}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--side-muted);font:600 15px var(--body);padding:11px 12px;border-radius:8px;cursor:pointer}
.side-nav button svg{width:20px;height:20px;flex:none}
.side-nav button:hover{color:var(--side-ink);background:var(--side-hi)}
.side-nav button[aria-current="page"]{color:var(--side-ink);background:var(--side-hi);box-shadow:inset 3px 0 0 #ffffff}
.side-nav .count{margin-left:auto;font:700 12px var(--body);background:#fff;color:var(--side);border-radius:999px;padding:2px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 6px}
.till{border:1px solid var(--side-hi);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.till .k{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.till .v{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.till .s{font-size:12px;color:var(--side-muted)}
.side-foot button{background:none;border:1px solid var(--side-hi);color:var(--side-muted);font:600 13px var(--body);padding:9px 12px;border-radius:8px;cursor:pointer}
.side-foot button:hover{color:var(--side-ink)}

/* Main canvas */
main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead .date{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pagehead h2{font:800 clamp(28px,4vw,40px)/1.02 var(--display);letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h3{font:700 18px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.kicker{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .sub{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}

/* Today hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
.hero .main{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.big{font:800 clamp(38px,6vw,60px)/.95 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big small{font-size:.42em;letter-spacing:0;color:var(--muted);font-weight:700;margin-right:6px}
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--sunk)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.m-cash{background:var(--accent)} .m-momo{background:#f2b705} .m-card{background:#7c6ee6} .m-transfer{background:#3f8fd8} .m-deposit{background:#e07a4a} .m-plan{background:var(--good)}
.hero .side{background:var(--sunk);border-left:1px solid var(--line);display:grid;grid-template-rows:repeat(3,1fr)}
.stat{padding:16px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-bottom:1px solid var(--line);min-width:0}
.stat:last-child{border-bottom:0}
.stat .v{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* People rows */
.people{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:600}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--display);flex:none;color:var(--ink)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:6px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--sunk);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.energy{display:inline-flex;align-items:center;font:800 12px/1 var(--display);color:#fff;padding:4px 12px 4px 7px;clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%);min-width:30px}

/* Buttons & inputs */
button,.btn{font:600 14px/1 var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 15px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--muted)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
button.primary:hover{background:var(--accent);border-color:var(--accent)}
button.go{background:var(--tag);border-color:var(--tag);color:var(--tag-ink);font-weight:700}
button.go:hover{filter:brightness(1.08);border-color:var(--tag)}
button.small{padding:8px 11px;font-size:13px;border-radius:8px}
button.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;resize:vertical;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;width:260px;max-width:100%}
.search input{padding-left:36px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px 12px;font-size:13px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* Shelf of products */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:999px;padding:7px 13px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.prod{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:16px 14px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:400;box-shadow:var(--shadow);min-width:0}
.prod:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.prod .glyph{width:46px;height:46px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--accent)}
.prod .glyph svg{width:26px;height:26px}
.prod .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.prod .nm b{font:700 16px/1.15 var(--display);color:var(--ink)}
.prod .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto}
.tag{position:relative;background:var(--tag);color:var(--tag-ink);font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;padding:7px 10px 7px 16px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);white-space:nowrap}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.left{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.left.low{color:var(--warn);font-weight:600} .left.out{color:var(--bad);font-weight:600}
.prod.out{opacity:.55}
.prod .e{position:absolute;top:14px;right:0}

/* Receipt-paper cart */
.receipt-wrap{position:sticky;top:24px;filter:drop-shadow(0 10px 18px rgb(15 38 41 / .16))}
.receipt-paper{background:var(--paper);color:var(--paper-ink);padding:22px 20px 20px;border-radius:4px 4px 0 0;display:flex;flex-direction:column;gap:14px}
.receipt-wrap::after{content:"";display:block;height:10px;background:radial-gradient(circle at 50% 100%,transparent 6px,var(--paper) 6.5px) 0 0/14px 10px repeat-x}
.rhead{text-align:center;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.rhead b{font:800 20px/1.1 var(--display);letter-spacing:-.01em;text-transform:none}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font:400 13px/1.35 var(--mono);padding:8px 0;border-bottom:1px dashed var(--line)}
.rline .n{font-weight:600}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;border-radius:0;padding:4px 10px;background:none;color:inherit}
.qty span{min-width:22px;text-align:center}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;font:800 26px var(--display);font-variant-numeric:tabular-nums;padding-top:4px;border-top:2px solid var(--paper-ink)}
.rnote{font:400 13px/1.45 var(--mono);background:var(--sunk);padding:10px 12px;border-radius:8px}
.rempty{font:400 13px var(--mono);text-align:center;color:var(--muted);padding:18px 0;border-bottom:1px dashed var(--line)}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.methods button{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:13px;background:var(--surface)}
.methods button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Plans as payment strips */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:14px}
.plan.overdue{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.plan .top{display:flex;gap:12px;align-items:center}
.plan .top .who{flex:1;min-width:0}
.plan .top b{font:700 17px/1.15 var(--display)}
.strip{display:flex;gap:3px}
.strip i{flex:1;height:22px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.strip i.paid{background:var(--accent);border-color:var(--accent)}
.strip i.dep{background:var(--ink);border-color:var(--ink)}
.strip i.part{background:linear-gradient(90deg,var(--accent) 50%,var(--sunk) 50%);border-color:var(--accent)}
.strip i.miss{background:var(--bad-soft);border-color:var(--bad)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.figs div{display:flex;flex-direction:column;gap:2px;min-width:0}
.figs b{font:700 clamp(13px,3.4vw,16px) var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan .acts{justify-content:space-between}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.tcard{padding:0;overflow:hidden}
.itemcell{display:flex;align-items:center;gap:12px;min-width:200px}
.itemcell .glyph{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--accent);flex:none}
.itemcell .glyph svg{width:22px;height:22px}
.meter{width:90px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)} .meter.out i{background:var(--bad)}
.mono{font-family:var(--mono);font-size:13px}

.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);padding:12px 16px;border-radius:12px;font-weight:600}
.reorder{display:flex;flex-direction:column;gap:10px}
.reorder .r{display:flex;align-items:center;gap:12px}
.reorder .r .who{flex:1;min-width:0}

/* Modal */
.overlay{position:fixed;inset:0;background:rgb(40 6 18 / .55);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 60px -20px rgb(0 0 0 / .45)}
.modal h2{font:800 24px/1.1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.printed{font:400 13px/1.5 var(--mono);white-space:pre-wrap;background:var(--paper);color:var(--paper-ink);padding:18px;border-radius:6px;border:1px dashed var(--line);overflow-x:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sched{display:flex;flex-direction:column}
.sched .s{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sched .s:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:var(--shadow)}

/* Phone: sidebar becomes a top brand bar + bottom tab bar */
.mobilebar,.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .mobilebar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink);align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobilebar b{font:800 19px/1.1 var(--display);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}

/* Short lease on a product so two tills never sell the same unit or miscount stock */
async function withLock(id){
  const ref = db.collection('products').doc(id);
  for (let t = 0; t < 14; t++){
    let r;
    try { r = await ref.acquire({ holder: TAB_ID, ttlMs: 2500 }); }
    catch(e){ if (['capability_removed','capability_disabled','transform_error'].includes(e?.code)) { const s = await ref.get(); return { ref, data: s.exists ? s.data() : null }; } throw e; }
    if (r && r.acquired) { const s = await ref.get(); return { ref, data: s.exists ? s.data() : null }; }
    await sleep(180 + Math.random()*220);
  }
  throw { code:'busy', message:'Another till is updating this item. Try again in a moment.' };
}

/* ================= Installment maths ================= */
function planStats(p){
  const paid = round2((p.payments||[]).reduce((a,x)=>a+Number(x.amount||0),0));
  if (p.cancelled) return { paid, balance:0, nextDue:null, status:'cancelled', label:'Returned', cls:'plain', late:0, arrears:0 };
  const balance = round2(Math.max(0, p.total - paid));
  const today = todayISO();
  let dueCount = 0;
  for (let k=1; k<=p.count; k++) if (addPeriod(p.startDate,k,p.freq) <= today) dueCount++;
  const expected = round2(Math.min(p.total, p.deposit + p.instalment*dueCount));
  const covered = Math.min(p.count, Math.floor((paid - p.deposit + 0.01) / p.instalment));
  const nextDue = covered < p.count ? addPeriod(p.startDate, covered+1, p.freq) : null;
  let status = 'ontrack', label = 'On track', cls = 'good', late = 0;
  if (balance <= 0.009) { status='paid'; label='Paid off'; cls='plain'; }
  else if (paid + 0.01 < expected) { late = dayDiff(nextDue, today); status='overdue'; label = late + (late===1?' day late':' days late'); cls='bad'; }
  else if (nextDue && dayDiff(today, nextDue) <= 3) { const d = dayDiff(today,nextDue); status='soon'; label = d===0?'Due today':'Due in '+d+(d===1?' day':' days'); cls='warn'; }
  return { paid, balance, nextDue, status, label, cls, late, arrears: round2(Math.max(0, expected - paid)) };
}
function scheduleStates(p){
  let rest = planStats(p).paid - p.deposit; const t = todayISO(); const out = [];
  for (let k=1;k<=p.count;k++){ const due = addPeriod(p.startDate,k,p.freq);
    const s = rest >= p.instalment-0.01 ? 'paid' : rest > 0.01 ? 'part' : (due < t && !p.cancelled) ? 'miss' : 'up';
    rest -= p.instalment; out.push({due, s}); }
  return out;
}
const overdueCount = () => list(S.plans).filter(p=>planStats(p).status==='overdue').length;

/* ================= Money flows & reports ================= */
function flow(from, to){
  const by = { cash:0, momo:0, card:0, transfer:0 }; let refunds = 0, planIn = 0, n = 0, sold = 0, returnedN = 0;
  const inR = d => d >= from && d <= to;
  for (const s of list(S.sales)){
    const d = s.date.slice(0,10);
    if (inR(d)) { const allBack = retUnits(s).length >= unitCount(s); if (allBack) returnedN++; else n++;
      sold += s.total; if (s.method !== 'installment') by[s.method] = (by[s.method]||0) + s.total; }
    for (const r of (s.returns||[])) if (inR(r.date)) { by[r.method] = (by[r.method]||0) - r.refund; refunds += r.refund;
      // Goods coming back reduce goods sold by the value of the units returned.
      const sh = shareOf(s); sold -= (r.units||[]).reduce((a,u) => a + (s.items[u.i]?.price || 0) * sh, 0); }
  }
  for (const p of list(S.plans)) for (const pay of (p.payments||[])) if (inR(pay.date)) { by[pay.method] = (by[pay.method]||0) + pay.amount; planIn += pay.amount; }
  for (const k in by) by[k] = round2(by[k]);
  return { by, refunds: round2(refunds), planIn: round2(planIn), n, returnedN, sold: round2(Math.max(0, sold)), total: round2(Object.values(by).reduce((a,b)=>a+b,0)) };
}
function metrics(from, to){
  let gross=0, disc=0, n=0, cogs=0, refunds=0, units=0; const byDay={}, byProd={}, byStaff={}, byCat={}, byChannel={};
  for (const s of list(S.sales)){
    const d = s.date.slice(0,10), sh = shareOf(s);
    if (d>=from && d<=to){ n++; gross += s.total; disc += saleDisc(s); byDay[d] = (byDay[d]||0) + s.total;
      s.items.forEach(i => { const c = itemCost(i)*i.qty; cogs += c; units += i.qty;
        const k = i.productId || i.name; const bp = byProd[k] || (byProd[k] = { name:i.name, units:0, rev:0, cost:0 }); bp.units += i.qty; bp.rev += i.price*i.qty*sh; bp.cost += c;
        const cat = S.products[i.productId]?.category || 'Other'; byCat[cat] = (byCat[cat]||0) + i.price*i.qty*sh; });
      const st = s.staffId || ''; byStaff[st] = (byStaff[st]||0) + s.total;
      const ch = isOnline(s) ? 'Online' : 'In shop'; byChannel[ch] = (byChannel[ch]||0) + s.total; }
    for (const r of (s.returns||[])) if (r.date>=from && r.date<=to){ refunds += r.refund; byDay[r.date] = (byDay[r.date]||0) - r.refund;
      if (r.restocked) (r.units||[]).forEach(u => { const i = s.items[u.i]; if (i) { cogs -= itemCost(i); const bp = byProd[i.productId||i.name]; if (bp){ bp.units -= 1; bp.rev -= i.price*sh; bp.cost -= itemCost(i); } } }); }
  }
  const net = gross - refunds;
  return { gross:round2(gross), disc:round2(disc), n, cogs:round2(cogs), refunds:round2(refunds), net:round2(net), profit:round2(net-cogs), units, byDay, byProd, byStaff, byCat, byChannel };
}
function periodRange(p){
  const t = new Date();
  if (p==='today') return [isoOf(t), isoOf(t), 'Today'];
  if (p==='week'){ const d = new Date(t); d.setDate(d.getDate() - (d.getDay()+6)%7); return [isoOf(d), isoOf(t), 'This week']; }
  if (p==='month') return [isoOf(new Date(t.getFullYear(), t.getMonth(), 1)), isoOf(t), 'This month'];
  if (p==='last') return [isoOf(new Date(t.getFullYear(), t.getMonth()-1, 1)), isoOf(new Date(t.getFullYear(), t.getMonth(), 0)), 'Last month'];
  const d = new Date(t); d.setDate(d.getDate()-89); return [isoOf(d), isoOf(t), 'Last 90 days'];
}

function discError(){ const sub = cartSub(), d = cartDisc(); if (!d || !sub) return ''; const pct = d/sub*100; const max = myMaxDisc();

function match(p, q){ q = (q||'').trim().toLowerCase(); if (!q) return true; return [p.name,p.brand,p.category,...serialsOf(p)].join(' ').toLowerCase().includes(q); }

/* ================= Warranty ================= */
function unitsSold(){ const out = [];
  for (const s of list(S.sales)) s.items.forEach((i,ix) => { const sns = unitSerials(i); for (let u=0; u<i.qty; u++) out.push({ s, i, ix, u, serial: sns[u] || '' }); });
  return out; }
function warrantyInfo(x){
  const start = x.s.date.slice(0,10), months = x.i.warrantyMonths || 0, end = months ? addPeriod(start, months, 'monthly') : start;
  if (isReturned(x.s, x.ix, x.u)) return { end, cls:'plain', label:'Returned', pct:0 };
  const t = todayISO(); const total = Math.max(1, dayDiff(start, end)), left = dayDiff(t, end);
  if (!months || left < 0) return { end, cls:'plain', label:'Out of warranty', pct:0, exp:true };
  const ml = Math.max(0, Math.round(left/30.4));
  return { end, cls: left < 31 ? 'warn' : 'good', label: ml >= 1 ? `${ml} ${ml===1?'month':'months'} left` : `${left} ${left===1?'day':'days'} left`, pct: left/total*100 };
}

  const q = ui.wq.trim(), Q = q.toUpperCase(), ql = q.toLowerCase();

  const typeL = { repair:'Repair', replacement:'Replacement', inspection:'Inspection' };
  return head('Warranty', searchBox('wQ','Serial number, receipt or customer', ui.wq) + scanBtn('wQ','single')) + `
  ${q.length < 2 ? `<section class="card"><p style="margin:0">Type or scan the serial number from the appliance to see who bought it, when, and whether it is still under warranty. You can also search by receipt number or customer name.</p></section>` : ''}
  ${q.length >= 2 ? `<div class="wgrid">${hits.map(x => { const w = warrantyInfo(x); const prod = S.products[x.i.productId];
    const claimsFor = list(S.claims).filter(c=>c.saleId===x.s.id && c.itemIndex===x.ix && (c.serial||'')===x.serial);
    return `<article class="card wcard">
      <div class="wtop"><span class="glyph">${glyph(prod?.category)}</span><div class="who"><b>${esc(x.i.name)}</b><div class="sub mono">${x.serial?'S/N '+esc(x.serial):'No serial recorded'}</div></div><span class="pill ${w.cls}">${w.label}</span></div>
      <div class="meterw ${w.exp?'exp':''}"><i style="width:${w.pct}%"></i></div>
      ${x.i.received && x.i.received[x.serial] ? `<div class="sub">Received ${fmtDT(x.i.received[x.serial])} · sold ${fmtDT(x.s.date)}</div>` : `<div class="sub">Sold ${fmtDT(x.s.date)}</div>`}

const diffPill = (l, d) => { d = round2(d||0); return Math.abs(d)<0.01 ? `<span class="pill good">${l} ok</span>` : d<0 ? `<span class="pill bad">${l} −${money(-d)}</span>` : `<span class="pill warn">${l} +${money(d)}</span>`; };
async function downloadCsv(){

  list(S.sales).filter(s=>{const d=s.date.slice(0,10); return d>=from&&d<=to;}).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>rows.push([
    s.date.slice(0,16).replace('T',' '), s.receipt, isOnline(s)?'Online':'In shop', saleCust(s), S.customers[s.customerId]?.phone||'', staffName(s.staffId), s.items.map(i=>i.name+(i.qty>1?' x'+i.qty:'')).join('; '), s.items.map(i=>unitSerials(i).join(' ')).join('; '), METHODS[s.method], saleSub(s).toFixed(2), saleDisc(s).toFixed(2), s.total.toFixed(2), (s.refundTotal||0).toFixed(2)]));

}

/* ---------- Camera barcode scanner ----------
   Uses the browser's own barcode reader where it has one (Chrome on Android), otherwise ZXing. */
const scanBtn = (target, mode, label = 'Scan') => `<button type="button" class="small scanbtn" data-scan="${target}|${mode}" aria-label="Scan a barcode with the camera">${IC.scan}${label}</button>`;
const SCAN = { stream:null, stop:null, mode:'', target:'', got:[], last:'', lastAt:0 };
function beep(){ try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1400; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .09); setTimeout(() => a.close(), 300); } catch(e){} try { navigator.vibrate && navigator.vibrate(60); } catch(e){} }
async function openScanner(target, mode){
  if (!navigator.mediaDevices?.getUserMedia) { toast('This browser cannot use the camera. Type the serial number instead.'); return; }
  Object.assign(SCAN, { mode, target, got:[], last:'', lastAt:0 });
  $('#scanRoot').innerHTML = `<div class="scanner" role="dialog" aria-label="Barcode scanner"><video id="scanVid" playsinline muted></video><div class="frame"></div>
    <div class="bottom"><div class="bar"><b>${mode === 'multi' ? 'Scan each box. Every serial is added to the list.' : 'Point the camera at the barcode.'}</b><button class="primary" data-scandone>${mode === 'multi' ? 'Done' : 'Cancel'}</button></div>
    <div class="got" id="scanGot"></div><span class="sub" id="scanMsg">Starting the camera…</span></div></div>`;
  try { SCAN.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal:'environment' }, width: { ideal:1280 }, height: { ideal:720 } }, audio:false }); }
  catch(e){ closeScanner(); toast(e && e.name === 'NotAllowedError' ? 'Camera permission was refused. Allow the camera for this site in your browser settings.' : 'Could not start the camera.'); return; }
  const v = $('#scanVid'); v.srcObject = SCAN.stream; try { await v.play(); } catch(e){}
  $('#scanMsg').textContent = 'Hold the barcode inside the box, about a hand’s length away.';
  const formats = ['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
  let native = null;
  if ('BarcodeDetector' in window) { try { const ok = await BarcodeDetector.getSupportedFormats(); native = new BarcodeDetector({ formats: formats.filter(f => ok.includes(f)) }); } catch(e){ native = null; } }

      const fresh = (await db.collection('sales').doc(id).get()).data() || s;
      if ((fresh.returns||[]).flatMap(r=>r.units).some(u=>entry.units.some(x=>x.i===u.i && x.u===u.u))) throw { code:'stale', message:'Some of these units were already returned on another till.' };
      await db.collection('sales').doc(id).update({ returns: [...(fresh.returns||[]), entry], refundTotal: round2((fresh.refundTotal||0) + amt) });
      if (restock) { const byP = {}; chosen.forEach(x => { const pid = s.items[x.ix].productId; (byP[pid] ||= []).push(x); });
        for (const pid of Object.keys(byP)) { const L = await withLock(pid); if (!L.data) continue;
          const back = byP[pid].map(x=>x.serial).filter(sn => sn && !serialsOf(L.data).includes(sn));
          const dates = { ...serialDatesOf(L.data) }; back.forEach(sn => { dates[sn] = entry.at; });
          await L.ref.update({ stock: (L.data.stock||0) + byP[pid].length, serials: [...serialsOf(L.data), ...back], serialDates: dates });
          await logStock({ type:'returned', at: entry.at, productId:pid, productName:s.items[byP[pid][0].ix].name, qty:byP[pid].length, serials:back, saleId:id, receipt:s.receipt, note: $('#rt_reason').selectedOptions[0]?.textContent || '' }); } }
      if (isPlan && plan) await db.collection('plans').doc(plan.id).update({ cancelled: true, cancelledAt: todayISO() });
    }, 'Return recorded');
    if (ok) { closeModal(); render(); setTimeout(()=>showReceipt(id), 200); }
  });
}

async function completeSale(){
  const sub = cartSub(), disc = cartDisc(), total = round2(sub - disc);
  const items = cart.items.map(i=>({...i}));
  const byProd = {}; items.forEach(i => { (byProd[i.productId] ||= []).push(i); });
  const staffId = meObj()?.id || '';
  let saleId = null;
  const ok = await write(async () => {
    const locked = {};
    for (const pid of Object.keys(byProd)) {
      const L = await withLock(pid);
      if (!L.data) throw { code:'stale', message:'An item in this sale was just deleted. Remove it and try again.' };
      const need = byProd[pid].reduce((a,i)=>a+i.qty,0);
      if ((L.data.stock||0) < need) throw { code:'stale', message:`Only ${L.data.stock} ${L.data.brand} ${L.data.name} left on the shelf. Another till may have just sold one.` };
      const have = serialsOf(L.data);
      for (const i of byProd[pid]) for (const sn of (i.serials||[])) if (have.length && !have.includes(sn)) throw { code:'stale', message:`Serial ${sn} was just sold on another till. Pick another unit.` };
      locked[pid] = L;
    }
    const sref = db.collection('sales').doc(); saleId = sref.id;
    const sale = { id:sref.id, receipt:'R-' + Date.now().toString(36).slice(-6).toUpperCase(), date:new Date().toISOString(), customerId:cart.customerId||'', method:cart.method, subtotal:sub, discount:disc, discountNote: disc ? cart.discNote.trim() : '', total, staffId, channel: cart.channel === 'online' ? 'online' : 'shop', delivery: cart.channel === 'online' ? cart.delivery.trim() : '',
      ...(cart.channel === 'online' ? { deliveryStatus:'pending', deliveryLog:[{ status:'pending', at: nowISO(), by: staffId }] } : {}),
      items: items.map(i=>{ const sd = serialDatesOf(locked[i.productId].data); const rec = {}; (i.serials||[]).forEach(sn => { if (sd[sn]) rec[sn] = sd[sn]; });
        return { productId:i.productId, name:i.name, qty:i.qty, price:i.price, cost: Number(locked[i.productId].data.cost||0), serials:i.serials||[], serial:(i.serials||[]).join(', '), received: rec, warrantyMonths:i.warrantyMonths||0 }; }) };
    let pref = null;
    if (cart.method==='installment'){ pref = db.collection('plans').doc(); sale.deposit = round2(Number(cart.deposit)||0); sale.depositMethod = cart.depositMethod; sale.planId = pref.id; }
    await sref.set(sale);
    if (pref) { const dep = sale.deposit; await pref.set({ id:pref.id, saleId:sref.id, customerId:cart.customerId, productName: items.map(i=>i.name).join(', '), total, deposit:dep, count:cart.count, freq:cart.freq, instalment: round2((total-dep)/cart.count), startDate: todayISO(), payments: dep>0?[{ date:todayISO(), amount:dep, method:cart.depositMethod, deposit:true, staffId, at: sale.date }]:[], createdAt: sale.date }); }
    for (const pid of Object.keys(locked)) { const { ref, data } = locked[pid]; const sold = byProd[pid].flatMap(i=>i.serials||[]); const qty = byProd[pid].reduce((a,i)=>a+i.qty,0);
      const dates = { ...serialDatesOf(data) }; sold.forEach(sn => { delete dates[sn]; });
      await ref.update({ stock: Math.max(0,(data.stock||0)-qty), serials: serialsOf(data).filter(sn=>!sold.includes(sn)), serialDates: dates, lastSoldAt: sale.date });
      await logStock({ type:'sold', at: sale.date, productId:pid, productName:byProd[pid][0].name, qty:-qty, serials:sold, saleId:sref.id, receipt:sale.receipt, price:byProd[pid][0].price }); }
  }, 'Sale recorded');
  if (!ok) return;
  Object.assign(cart, freshCart());
  closeModal(); render();
  setTimeout(()=>showReceipt(saleId), 200);
}

const API = {
  token: (() => { try { return localStorage.getItem('shopToken'); } catch(e) { return null; } })(),
  setToken(t){ this.token = t; try { t ? localStorage.setItem('shopToken', t) : localStorage.removeItem('shopToken'); } catch(e){} },
  async call(path, payload){
    let r;
    try { r = await fetch('/api/' + path, { method: payload ? 'POST' : 'GET', headers: { 'content-type':'application/json', ...(this.token ? { authorization:'Bearer ' + this.token } : {}) }, body: payload ? JSON.stringify(payload) : undefined }); }
    catch(e){ setOffline(true); throw { code:'unavailable', message:'No connection. Check the internet and try again.' }; }
    setOffline(false);
    let j = null; try { j = await r.json(); } catch(e){}
    if (r.status === 401 && path !== 'login') { signedOut(); throw { code:'auth', message:'Please sign in again.' }; }
    if (!r.ok) throw { code: j?.code || (r.status >= 500 ? 'unavailable' : 'invalid_argument'), message: j?.message };
    return j;
  }
};

/* A small client store with the same calls the app already makes (collection, doc, onSnapshot, acquire),
   kept in step with the server by polling. */
let store = null;
function makeStore(){
  const data = {}; const listeners = []; let rev = 0, timer = null, first = false, stopped = false;
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const fire = cols => listeners.forEach(l => { if (!cols || cols.has(l.col)) l.run(); });
  function apply(rows){ const cols = new Set();
    for (const r of rows){ cols.add(r.col); const c = data[r.col] || (data[r.col] = {});
      if (r.deleted) delete c[r.id]; else c[r.id] = r.data;
      if (r.rev > rev) rev = r.rev; }
    if (rows.length && first) fire(cols); }
  async function pull(){
    let more = true;
    while (more) { const j = await API.call('sync?since=' + rev); apply(j.docs); rev = Math.max(rev, j.rev || 0); more = j.more; }
    if (!first) { first = true; fire(); }
  }
  function loop(){ if (stopped) return; clearTimeout(timer); timer = setTimeout(async () => { if (document.visibilityState === 'visible') { try { await pull(); } catch(e){} } loop(); }, 4000); }
  document.addEventListener('visibilitychange', () => { if (!stopped && document.visibilityState === 'visible') pull().catch(()=>{}); });
  const snap = (id, d) => ({ id, exists: d != null, data: () => clone(d), metadata: { fromCache:false, hasPendingWrites:false } });
  async function writeOps(ops){ const j = await API.call('write', { ops }); apply(j.docs); fire(new Set(ops.map(o=>o.col))); }
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  function docRef(col, id){ return { id, path: col + '/' + id,
    async get(){ const j = await API.call('doc?col=' + encodeURIComponent(col) + '&id=' + encodeURIComponent(id)); return snap(id, j.exists ? j.data : null); },
    set: d => writeOps([{ op:'set', col, id, data:d }]),
    update: d => writeOps([{ op:'update', col, id, data:d }]),
    delete: () => writeOps([{ op:'delete', col, id }]),
    acquire: o => API.call('lock', { key: col + '/' + id, holder: o.holder, ttl: o.ttlMs }),
    onSnapshot(next){ const l = { col, run: () => next(snap(id, (data[col]||{})[id])) }; listeners.push(l); if (first) l.run(); return () => listeners.splice(listeners.indexOf(l), 1); } }; }
  return {
    collection: col => ({ path: col, doc: id => docRef(col, id || newId()),
      onSnapshot(next, err){ const l = { col, run: () => next({ docs: Object.entries(data[col]||{}).map(([id,d]) => snap(id, d)) }) }; listeners.push(l); if (first) l.run(); return () => listeners.splice(listeners.indexOf(l), 1); } }),
    doc: path => { const [c, i] = path.split('/'); return docRef(c, i); },
    async removeSamples(){ const j = await API.call('remove-samples', {}); apply(j.docs); fire(); return j; },
    async users(payload){ const j = await API.call('users', payload); apply(j.docs); fire(new Set(['staff'])); return j; },
    async start(){ await pull(); loop(); },
    stop(){ stopped = true; clearTimeout(timer); },
  };
}

async function boot(){
  BOOT.phase = 'loading'; render();
  let st;
  try { st = await API.call('status'); }
  catch(e){ BOOT.phase = 'error'; BOOT.msg = e.message; return render(); }
  if (!st.db) { BOOT.phase = 'nodb'; return render(); }
  if (!st.setup) { BOOT.phase = 'setup'; return render(); }
  if (!API.token) { BOOT.phase = 'login'; return render(); }
  try { const j = await API.call('me'); setMe(j.user); }
  catch(e){ if (e.code === 'auth') return; BOOT.phase = 'error'; BOOT.msg = e.message; return render(); }
  await connect();
}
async function connect(){
  store = makeStore();
  const s = store;
  for (const col of COLS) s.collection(col).onSnapshot(snap => { const m = {}; snap.docs.forEach(d=>{ m[d.id] = { ...d.data(), id:d.id }; }); S[col] = m; ready[col] = true; safeRender(); });
  s.doc('settings/shop').onSnapshot(x => { if (x.exists) S.settings = { ...S.settings, ...x.data() }; safeRender(); });
  try { await s.start(); db = s; dl = fileSaver; BOOT.phase = 'ready'; render(); }
  catch(e){ if (e.code === 'auth') return; BOOT.phase = 'error'; BOOT.msg = e.message; render(); }
}

    <span class="err" id="pwErr" role="alert"></span><button class="primary" type="submit">Change password</button></form>`);
}
function printReceipt(id){
  const s = S.sales[id]; if (!s) return;
  let el = document.getElementById('printArea'); if (!el) { el = document.createElement('div'); el.id = 'printArea'; document.body.appendChild(el); }
  el.innerHTML = `<img class="plogo" src="/logo.png" alt="">`; const pre = document.createElement('div'); pre.textContent = receiptText(s); el.appendChild(pre);
  const img = el.querySelector('img'); if (img.complete) window.print(); else { img.onload = img.onerror = () => window.print(); }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
boot();
})();
